<title>За кадром: сценарії</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Manrope:wght@400;600;700&display=swap">
<style>
:root{--bg:#0c0a0d;--panel:#16121a;--line:#2a2129;--fg:#f5f2f0;--muted:#a99f9d;--red:#d61c34;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Manrope","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px}
.eyebrow{font:600 12px ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.eyebrow b{width:10px;height:10px;border-radius:50%;background:var(--red)}
h1{font:800 26px/1.15 "Unbounded","Segoe UI Black",system-ui,sans-serif;margin:0}
p{margin:0;color:var(--muted);font-size:14.5px}
input{font:16px inherit;font-family:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{font:700 16px inherit;font-family:inherit;padding:12px;border-radius:8px;border:0;background:var(--red);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
input:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.err{color:#ff8a98;min-height:1.4em;font-size:14px}
</style>
</head>

<script>
(function(){
var f=document.getElementById("f"),pw=document.getElementById("pw"),go=document.getElementById("go"),err=document.getElementById("err");
function b(s){var x=atob(s),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}
if(!window.crypto||!crypto.subtle){err.textContent="Цей браузер не вміє розшифровувати. Відкрий сторінку в Chrome або Safari за адресою https.";go.disabled=true;return}
f.addEventListener("submit",async function(e){
  e.preventDefault();if(go.disabled)return;
  err.textContent="";go.disabled=true;go.textContent="Перевіряю…";
  try{
    var d=JSON.parse(document.getElementById("data").textContent);
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.value),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(d.salt),iterations:d.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(d.iv)},key,b(d.ct)));
    pw.value="";
    document.open();document.write(html);document.close();
  }catch(x){
    go.disabled=false;go.textContent="Відкрити";err.textContent="Пароль не підходить. Перевір і спробуй ще раз.";pw.select();
  }
});
})();
</script>
